services:
  dfk-billing:
    build: .
    image: dfk-billing
    container_name: dfk-billing
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:/app/data/dfk.db
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET wajib diset di .env — lihat README}
      CADANGAN_DIR: /app/data/cadangan-otomatis
      UPLOAD_DIR: /app/data/upload
    volumes:
      - ./data:/app/data
